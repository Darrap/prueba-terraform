name: Deploy to Amazon ECS (FARGATE)

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: image-registry
      CONTAINER_NAME: autoship
      ECS_SERVICE: autoship_service
      ECS_CLUSTER: imageCluster
      AWS_ROLE_ARN: "arn:aws:iam::463932053173:role/github-actions-ecs-role"
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActionsSession

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -euo pipefail
        
        : "${ECR_REGISTRY:?ECR_REGISTRY is not set}"
        : "${ECR_REPOSITORY:?ECR_REPOSITORY is not set}"
        : "${IMAGE_TAG:?IMAGE_TAG is not set}"

        ECR_REGISTRY=$(echo "$ECR_REGISTRY" | xargs)
        ECR_REPOSITORY=$(echo "$ECR_REPOSITORY" | xargs)
        IMAGE_TAG=$(echo "$IMAGE_TAG" | xargs)

        echo "Building Docker image..."
        docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile .
        echo "Pushing Docker images to ECR"
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Add the new image ID in ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ecs/task-def.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}
      
    - name: Deploy to task definition to Amazon ECS service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true